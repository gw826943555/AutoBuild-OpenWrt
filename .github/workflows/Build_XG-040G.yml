name: Build_XG-040G

# Add a button to trigger the workflow
on: 
  repository_dispatch:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'
    
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: sudo apt-get update && sudo apt-get install -y dwarves

    - name: Clone source code
      env: 
        REPO_URL: https://github.com/gw826943555/openwrt
        REPO_BRANCH: airoha
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt

        # 添加feeds
        git clone https://github.com/muink/openwrt-chinadns-ng package/chinadns-ng
        git clone https://github.com/gw826943555/homeproxy package/luci-app-homeproxy
        git clone https://github.com/gw826943555/luci-app-cpu-status-mini.git package/luci-app-cpu-status-mini
        git clone https://github.com/gSpotx2f/luci-app-disks-info.git package/luci-app-disks-info
        git clone https://github.com/gSpotx2f/luci-app-temp-status.git package/luci-app-temp-status
        git clone https://github.com/gw826943555/openwrt-logview.git package/openwrt-logview
        git clone https://github.com/gw826943555/openwrt_msd_lite.git package/openwrt_msd_lite
        git clone https://github.com/gw826943555/openwrt-vlmcsd.git package/openwrt-vlmcsd
        git clone https://github.com/gw826943555/openwrt-vsftpd.git package/openwrt-vsftpd
        git clone https://github.com/yichya/luci-app-xray package/luci-app-xray
        git clone https://github.com/timsaya/openwrt-bandix.git package/openwrt-bandix
        git clone https://github.com/timsaya/luci-app-bandix.git package/luci-app-bandix
        git clone https://github.com/muink/luci-app-natmapt.git package/luci-app-natmapt
        git clone https://github.com/4IceG/luci-app-crontab-wizard.git package/luci-app-crontab-wizard
        git clone https://github.com/muink/openwrt-natmapt.git package/openwrt-natmapt
        git clone https://github.com/gw826943555/openwrt-easytier.git package/openwrt-easytier
        git clone https://github.com/kenzok8/openwrt-clashoo.git package/openwrt-clashoo
        git clone https://github.com/looong-cat/luci-app-netbird.git package/luci-app-netbird
        git clone https://github.com/luanmuc/luci-app-airoha-npu.git package/luci-app-airoha-npu
        git clone https://github.com/stackia/rtp2httpd.git package/openwrt-rtp2httpd
        git clone https://github.com/gw826943555/shadowproxy.git package/shadowproxy

    - name: Update & Install feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # xg-040g-md (an7581) 与 xg-040g-mf (an7583) 属于不同 subtarget，
    # 无法用 CONFIG_TARGET_MULTI_PROFILE 合并到一个 .config 中，
    # 因此在同一个任务里依次构建：复用同一份源码、feeds 和已编译的公共软件包，
    # 切换 subtarget 后只需重新编译对应 kernel 及目标相关包，无需 dirclean。
    - name: Configuration Customization - Build_XG-040G (md-ubi)
      env:
        TARGET_FILE: xg-040g-md.target
      run: |
        cat $TARGET_FILE xg-040g-common.config > openwrt/.config
        cd openwrt && make defconfig

    - name: Cache Build (md-ubi)
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: airoha-an7581
        prefix: 'openwrt'
        
    - name: Build firmware (md-ubi)
      working-directory: ./openwrt
      run: |
        echo -e "$(nproc) thread build."
        make -j$(nproc) V=s

    - name: Collect firmware (md-ubi)
      run: |
        mkdir -p firmware/md-ubi
        shopt -s nullglob
        files=(openwrt/bin/targets/airoha/an7581/openwrt-*)
        if [ ${#files[@]} -eq 0 ]; then
          echo "::error::No firmware files found under openwrt/bin/targets/airoha/an7581/"
          ls -laR openwrt/bin/targets/airoha/ || true
          exit 1
        fi
        cp -v "${files[@]}" firmware/md-ubi/
        ls -la firmware/md-ubi/

    - name: Configuration Customization - Build_XG-040G (mf-ubi)
      env:
        TARGET_FILE: xg-040g-mf.target
      run: |
        cat $TARGET_FILE xg-040g-common.config > openwrt/.config
        cd openwrt && make defconfig

    - name: Cache Build (mf-ubi)
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: airoha-an7583
        prefix: 'openwrt'

    - name: Build firmware (mf-ubi)
      working-directory: ./openwrt
      run: |
        echo -e "$(nproc) thread build."
        make -j$(nproc) V=s

    - name: Collect firmware (mf-ubi)
      run: |
        mkdir -p firmware/mf-ubi
        shopt -s nullglob
        files=(openwrt/bin/targets/airoha/an7583/openwrt-*)
        if [ ${#files[@]} -eq 0 ]; then
          echo "::error::No firmware files found under openwrt/bin/targets/airoha/an7583/"
          ls -laR openwrt/bin/targets/airoha/ || true
          exit 1
        fi
        cp -v "${files[@]}" firmware/mf-ubi/
        ls -la firmware/mf-ubi/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt-XG-040G
        path: firmware/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: OpenWrt-*
        path: artifacts

    - name: Prepare release files
      run: |
        mkdir -p release
        find artifacts -type f -name 'openwrt-*' -exec cp -v {} release/ \;
        echo "Release files:"
        ls -la release/
        if [ -z "$(ls -A release)" ]; then
          echo "::error::No firmware files found in downloaded artifacts"
          find artifacts -type f | head -50
          exit 1
        fi

    - name: Generate release tag
      id: release_tag
      run: |
        echo "release_tag=OpenWrt-xg-040g-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT

    - name: Create Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${{ steps.release_tag.outputs.release_tag }}" \
          --title "${{ steps.release_tag.outputs.release_tag }}" \
          release/*
