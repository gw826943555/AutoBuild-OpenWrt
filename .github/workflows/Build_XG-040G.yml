name: Build_XG-040G

# Add a button to trigger the workflow
on: 
  repository_dispatch:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: md-ubi
            target_file: xg-040g-md.target
            mixkey: airoha-an7581
          - device: mf-ubi
            target_file: xg-040g-mf.target
            mixkey: airoha-an7583

    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'
    
    - name: Checkout
      uses: actions/checkout@master

    - name: Clone source code
      env: 
        REPO_URL: https://github.com/csharper2005/openwrt
        REPO_BRANCH: nokia_xg-040g-mf-ubi
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt

        # 添加feeds
        git clone --recurse-submodules https://github.com/gw826943555/openwrt-packages-misc package/misc

        git clone https://github.com/muink/openwrt-chinadns-ng package/chinadns-ng
        git clone https://github.com/immortalwrt/homeproxy package/luci-app-homeproxy
        git clone https://github.com/huchd0/luci-app-netwiz.git package/luci-app-netwiz
        
    - name: Update & Install feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configuration Customization - Build_XG-040G (${{ matrix.device }})
      env:
        TARGET_FILE: ${{ matrix.target_file }}
      run: |
        cat $TARGET_FILE xg-040g-common.config > openwrt/.config
        chmod +x ./customize.sh && ./customize.sh
        cd openwrt && make defconfig

    - name: Cache Build
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: ${{ matrix.mixkey }}
        prefix: 'openwrt'
        
    - name: Build firmware
      working-directory: ./openwrt
      run: |
        echo -e "$(nproc) thread build."
        make -j$(nproc) V=s

    - name: Upload artifact
      uses: actions/upload-artifact@master
      with:
        name: OpenWrt-${{ matrix.device }}
        path: openwrt/bin/targets/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Generate release tag
      id: release_tag
      run: |
        echo "release_tag=OpenWrt-xg-040g-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_tag.outputs.release_tag }}
        files: |
          artifacts/**/*
