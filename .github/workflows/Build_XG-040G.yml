name: Build_XG-040G

# Add a button to trigger the workflow
on: 
  repository_dispatch:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: md-ubi
            target_file: xg-040g-md.target
            mixkey: airoha-an7581
            patches_dir: patches/xg-040g-md
          - device: mf-ubi
            target_file: xg-040g-mf.target
            mixkey: airoha-an7583
            patches_dir: ''

    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'
    
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clone source code
      env: 
        REPO_URL: https://github.com/gw826943555/openwrt
        REPO_BRANCH: main
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt

        # 添加feeds
        git clone --recurse-submodules https://github.com/gw826943555/openwrt-packages-misc package/misc

        git clone https://github.com/yichya/luci-app-xray package/luci-app-xray
        git clone https://github.com/timsaya/openwrt-bandix.git package/openwrt-bandix
        git clone https://github.com/timsaya/luci-app-bandix.git package/luci-app-bandix
        git clone https://github.com/muink/luci-app-natmapt.git package/luci-app-natmapt
        git clone https://github.com/4IceG/luci-app-crontab-wizard.git package/luci-app-crontab-wizard
        git clone https://github.com/muink/openwrt-natmapt.git package/openwrt-natmapt
        git clone https://github.com/gw826943555/openwrt-easytier.git package/openwrt-easytier
        git clone https://github.com/kenzok8/openwrt-clashoo.git package/openwrt-clashoo
        git clone https://github.com/looong-cat/luci-app-netbird.git package/luci-app-netbird
        git clone https://github.com/luanmuc/luci-app-airoha-npu.git package/luci-app-airoha-npu

    - name: Apply patches (${{ matrix.device }})
      if: matrix.patches_dir != ''
      run: |
        cp -v ${{ matrix.patches_dir }}/*.patch openwrt/package/boot/uboot-airoha/patches/
        
    - name: Update & Install feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configuration Customization - Build_XG-040G (${{ matrix.device }})
      env:
        TARGET_FILE: ${{ matrix.target_file }}
      run: |
        cat $TARGET_FILE xg-040g-common.config > openwrt/.config
        chmod +x ./customize.sh && ./customize.sh
        cd openwrt && make defconfig

    - name: Cache Build
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: ${{ matrix.mixkey }}
        prefix: 'openwrt'
        
    - name: Build firmware
      working-directory: ./openwrt
      run: |
        echo -e "$(nproc) thread build."
        make -j$(nproc) V=s

    - name: Collect firmware
      run: |
        mkdir -p firmware/${{ matrix.device }}
        shopt -s nullglob
        files=(openwrt/bin/targets/airoha/*/openwrt-*)
        if [ ${#files[@]} -eq 0 ]; then
          echo "::error::No firmware files found under openwrt/bin/targets/airoha/"
          ls -laR openwrt/bin/targets/airoha/ || true
          exit 1
        fi
        cp -v "${files[@]}" firmware/${{ matrix.device }}/
        ls -la firmware/${{ matrix.device }}/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt-${{ matrix.device }}
        path: firmware/${{ matrix.device }}/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: OpenWrt-*
        path: artifacts

    - name: Prepare release files
      run: |
        mkdir -p release
        find artifacts -type f -name 'openwrt-*' -exec cp -v {} release/ \;
        echo "Release files:"
        ls -la release/
        if [ -z "$(ls -A release)" ]; then
          echo "::error::No firmware files found in downloaded artifacts"
          find artifacts -type f | head -50
          exit 1
        fi

    - name: Generate release tag
      id: release_tag
      run: |
        echo "release_tag=OpenWrt-xg-040g-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT

    - name: Create Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${{ steps.release_tag.outputs.release_tag }}" \
          --title "${{ steps.release_tag.outputs.release_tag }}" \
          release/*
