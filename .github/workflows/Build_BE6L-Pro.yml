#=================================================
# Description: Build OpenWrt for Tenda BE6L Pro (Airoha AN7563)
# License: MIT
# Author: eSirPlayground
#=================================================

name: Build_BE6L-Pro

# Add a button to trigger the workflow
on:
  repository_dispatch:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Checkout
      uses: actions/checkout@v4

    - name: Clone source code
      env:
        REPO_URL: https://github.com/gw826943555/openwrt
        REPO_BRANCH: tenda_be6l-pro
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: Update & Install feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configuration Customization - Build_BE6L-Pro
      env:
        CONFIG_FILE: 'be6l-pro.config'
      run: |
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        cd openwrt && make defconfig

    - name: Cache Build
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: 'airoha-an7563'
        prefix: 'openwrt'

    - name: Build firmware
      working-directory: ./openwrt
      run: |
        echo -e "$(nproc) thread build."
        make -j$(nproc) V=s

    - name: Collect firmware
      run: |
        mkdir -p firmware/be6l-pro
        shopt -s nullglob
        files=(openwrt/bin/targets/airoha/*/openwrt-*)
        if [ ${#files[@]} -eq 0 ]; then
          echo "::error::No firmware files found under openwrt/bin/targets/airoha/"
          ls -laR openwrt/bin/targets/airoha/ || true
          exit 1
        fi
        cp -v "${files[@]}" firmware/be6l-pro/
        ls -la firmware/be6l-pro/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt-be6l-pro
        path: firmware/be6l-pro/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: OpenWrt-*
        path: artifacts

    - name: Prepare release files
      run: |
        mkdir -p release
        find artifacts -type f -name 'openwrt-*' -exec cp -v {} release/ \;
        echo "Release files:"
        ls -la release/
        if [ -z "$(ls -A release)" ]; then
          echo "::error::No firmware files found in downloaded artifacts"
          find artifacts -type f | head -50
          exit 1
        fi

    - name: Generate release tag
      id: release_tag
      run: |
        echo "release_tag=OpenWrt-be6l-pro-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT

    - name: Create Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${{ steps.release_tag.outputs.release_tag }}" \
          --title "${{ steps.release_tag.outputs.release_tag }}" \
          release/*
